name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.mesut --project-name mesut_iptv .
          rm -rf test

      - name: Patch AndroidManifest (internet, http, TV, AdMob)
        env:
          # معرّف تطبيق AdMob الخاص بك
          ADMOB_APP_ID: ca-app-pub-8292052707705243~8609546278
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <application android:usesCleartextTraffic="true"#' $M
          sed -i 's#<category android:name="android.intent.category.LAUNCHER"/>#&\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>#' $M
          sed -i 's#android:label="[^"]*"#android:label="Mesut IPTV"#' $M
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>\n    </application>#" $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*

      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --target-platform android-arm,android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: mesut-iptv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
