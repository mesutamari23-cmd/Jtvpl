name: Build Flutter APK Automatically

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Create Clean Flutter Project & Build
        run: |
          # 1. إنشاء مشروع جديد نظيف ومتوافق في مجلد مؤقت
          flutter create temp_project --org com.xtream.tv --project-name xtream_tv_app
          
          # 2. نقل ملفاتك البرمجية الخاصة بك إلى المشروع الجديد
          rm -rf temp_project/lib/*
          cp -r lib/* temp_project/lib/
          cp pubspec.yaml temp_project/
          
          # 3. الانتقال للمجلد الجديد وبناء التطبيق مباشرة
          cd temp_project
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtream-app-release
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
