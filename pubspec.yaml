name: xtream_tv_app
description: A modern IPTV player for Android TV and Mobile supporting Xtream Codes API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
